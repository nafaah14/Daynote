<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5A4230"/>
      <stop offset="0.55" stop-color="#43301F"/>
      <stop offset="1" stop-color="#332212"/>
    </linearGradient>
    <radialGradient id="sheen" cx="30%" cy="18%" r="75%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="barLeft" x1="150" y1="150" x2="230" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F3DEBA"/>
      <stop offset="1" stop-color="#D9AE78"/>
    </linearGradient>
    <linearGradient id="barRight" x1="282" y1="150" x2="362" y2="400" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F6E4C4"/>
      <stop offset="1" stop-color="#DDB47E"/>
    </linearGradient>
    <linearGradient id="barDiag" x1="190" y1="165" x2="322" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E9CB9E"/>
      <stop offset="1" stop-color="#C99A63"/>
    </linearGradient>
  </defs>

  <!-- background squircle -->
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="118" fill="url(#sheen)"/>

  <!-- diagonal stroke of the N, drawn first so verticals sit on top at the joints -->
  <rect x="220.16" y="87.04" width="71.68" height="337.92" rx="35.84" fill="url(#barDiag)"
        transform="rotate(-23 256 256)"/>

  <!-- left vertical stroke -->
  <rect x="153.6" y="102.4" width="71.68" height="307.2" rx="35.84" fill="url(#barLeft)"/>

  <!-- right vertical stroke -->
  <rect x="286.72" y="102.4" width="71.68" height="307.2" rx="35.84" fill="url(#barRight)"/>
</svg>
