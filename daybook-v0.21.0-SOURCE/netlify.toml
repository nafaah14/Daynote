[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  # Netlify's smart detection matches anything shaped like a Google API key.
  # The Firebase *web* config is exactly that shape and is NOT a secret: every
  # Firebase browser app ships its config, because the client has to know which
  # project to talk to. Google documents this. The data is protected by the
  # Firestore rules, which scope every document to request.auth.uid.
  #
  # This disables only the pattern heuristic. Scanning of environment variables
  # marked as secret keeps running, so a VAPID private key or a service-account
  # credential leaking into the bundle would still fail the build.
  #
  # Note there is deliberately no API key written in this file. Naming the value
  # in a safelist here just adds another scanned file containing it.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# SPA fallback so deep links like /reminders survive a refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
